name: Materialize CW12 3.27

on:
  push:
    branches: [main]
    paths:
      - '.upload/3.27/COMPLETE'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rebuild markdown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p books/cw12-psychology-and-alchemy/chapters
          cat .upload/3.27/part-000.b64 .upload/3.27/part-001.b64 | base64 -d | gzip -d > 'books/cw12-psychology-and-alchemy/chapters/CW12_Psychology_and_Alchemy_3.27_연금술의_유니콘_1차해설본.md'
          echo '5ad2cf98a8e0b2eaeb5698a52beb30a1a671e1acf961a9a0d016d0e3a5b91de0  books/cw12-psychology-and-alchemy/chapters/CW12_Psychology_and_Alchemy_3.27_연금술의_유니콘_1차해설본.md' | sha256sum -c -
          rm -rf .upload/3.27
          git rm .github/workflows/materialize-3-27.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/cw12-psychology-and-alchemy/chapters
          git commit -m 'Add CW12 3.27 Unicorn in Alchemy commentary'
          git push
