name: Restore CW12 clean payload

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  restore:
    if: github.event.issue.number == 1 && startsWith(github.event.comment.body, 'CW12CLEAN193CC5DF:COMPLETE:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble verified payload from PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MARKER: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          repo = os.environ['GH_REPO']
          issue = os.environ['ISSUE_NUMBER']
          token = os.environ['GH_TOKEN']
          marker = os.environ['MARKER'].strip()
          prefix = 'CW12CLEAN193CC5DF'
          mm = re.fullmatch(rf'{prefix}:COMPLETE:(\d{{3}}):([0-9a-f]{{64}})', marker)
          if not mm:
              raise SystemExit('Invalid completion marker')
          total = int(mm.group(1))
          expected_sha = mm.group(2)
          parts = {}
          page = 1
          while True:
              url = f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100&page={page}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'cw12-clean-restorer',
              })
              with urllib.request.urlopen(req) as resp:
                  rows = json.load(resp)
              if not rows:
                  break
              for row in rows:
                  body = (row.get('body') or '').strip()
                  m = re.fullmatch(rf'{prefix}:(\d{{3}})/(\d{{3}}):([A-Za-z0-9+/=]+)', body)
                  if not m:
                      continue
                  idx, declared_total, data = int(m.group(1)), int(m.group(2)), m.group(3)
                  if declared_total != total:
                      continue
                  if idx in parts and parts[idx] != data:
                      raise SystemExit(f'Conflicting duplicate payload part {idx}')
                  parts[idx] = data
              if len(rows) < 100:
                  break
              page += 1
          missing = [i for i in range(total) if i not in parts]
          if missing:
              raise SystemExit(f'Missing payload parts: {missing}')
          encoded = ''.join(parts[i] for i in range(total))
          raw = base64.b64decode(encoded, validate=True)
          actual_sha = hashlib.sha256(raw).hexdigest()
          print(f'payload bytes={len(raw)} sha256={actual_sha}')
          if actual_sha != expected_sha:
              raise SystemExit(f'SHA mismatch: expected {expected_sha}, got {actual_sha}')
          open('/tmp/cw12-clean.tar.xz','wb').write(raw)
          PY

      - name: Restore CW12 book data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf books/jung/cw12-psychology-and-alchemy
          tar -xJf /tmp/cw12-clean.tar.xz
          test -f books/jung/cw12-psychology-and-alchemy/book.yaml
          test "$(find books/jung/cw12-psychology-and-alchemy -type f | wc -l)" -eq 38

      - name: Commit restored webbook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/jung/cw12-psychology-and-alchemy
          if git diff --cached --quiet; then
            echo 'No content changes to commit.'
            exit 0
          fi
          git commit -m 'Publish CW12 Psychology and Alchemy webbook'
          git push origin main
